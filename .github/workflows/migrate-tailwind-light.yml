name: Migrate Tailwind Light

on:
  push:
    branches: [style/full-tailwind-light]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/full-tailwind-light
      - name: Convert UI to Tailwind light theme
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          files = [
              Path('src/App.tsx'),
              Path('src/EnhancementPanel.tsx'),
              Path('src/StoreAssetsPanel.tsx'),
              Path('src/react-main.tsx'),
              Path('index.html'),
          ]

          replacements = {
              "import './style.css'\n": '',
              "import './enhancement.css'\n": '',
              'bg-slate-950/70': 'bg-slate-50',
              'bg-slate-950/60': 'bg-slate-50',
              'bg-slate-950/50': 'bg-slate-50',
              'bg-slate-950/40': 'bg-slate-50',
              'bg-slate-950/30': 'bg-slate-50',
              'bg-slate-950': 'bg-slate-50',
              'bg-slate-900/70': 'bg-white',
              'bg-slate-900/60': 'bg-white',
              'bg-slate-900/50': 'bg-white',
              'bg-slate-900/40': 'bg-white',
              'bg-slate-900': 'bg-white',
              'border-slate-900': 'border-slate-200',
              'border-slate-800': 'border-slate-200',
              'border-slate-700': 'border-slate-300',
              'hover:border-slate-500': 'hover:border-slate-400',
              'text-slate-100': 'text-slate-900',
              'text-slate-200': 'text-slate-800',
              'text-slate-300': 'text-slate-700',
              'text-slate-400': 'text-slate-600',
              'text-white': 'text-slate-950',
              'text-cyan-200': 'text-cyan-800',
              'text-cyan-300': 'text-cyan-700',
              'text-cyan-400': 'text-cyan-700',
              'bg-cyan-500': 'bg-cyan-600',
              'bg-cyan-400/15': 'bg-cyan-50',
              'border-cyan-400': 'border-cyan-500',
              'text-rose-300': 'text-rose-700',
              'text-amber-300': 'text-amber-700',
              'text-emerald-300': 'text-emerald-700',
              'border-rose-900/70': 'border-rose-200',
              'shadow-black/20': 'shadow-slate-200/80',
              'shadow-black/10': 'shadow-slate-200/80',
              'shadow-cyan-500/15': 'shadow-cyan-100',
              'text-slate-950': 'text-white',
          }

          for path in files:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text)

          # Restore dark readable text where the blanket button foreground replacement was too broad.
          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace('className="app min-h-screen bg-slate-50 px-4 py-10 text-slate-900', 'className="app min-h-screen bg-slate-50 px-4 py-10 text-slate-900')
          text = text.replace('text-white sm:text-5xl', 'text-slate-950 sm:text-5xl')
          text = text.replace('font-semibold text-white">{item.preset.platform}', 'font-semibold text-slate-950">{item.preset.platform}')
          text = text.replace('font-semibold text-white">Fine-tune', 'font-semibold text-slate-950">Fine-tune')
          text = text.replace('font-semibold text-white">Image sizes', 'font-semibold text-slate-950">Image sizes')
          text = text.replace('bg-cyan-600 px-5 py-2.5 font-semibold text-white', 'bg-cyan-600 px-5 py-2.5 font-semibold text-white')
          text = text.replace('bg-cyan-600 font-semibold text-white', 'bg-cyan-600 font-semibold text-white')
          text = text.replace('bg-cyan-600 px-4 py-2 font-semibold text-white', 'bg-cyan-600 px-4 py-2 font-semibold text-white')
          app.write_text(text)

          # Explicit Tailwind styling for controls that previously relied on legacy descendant CSS.
          store = Path('src/StoreAssetsPanel.tsx')
          text = store.read_text()
          text = text.replace(
              'className="menu-panel store-panel rounded-3xl border border-slate-200 bg-white p-5"',
              'className="menu-panel store-panel rounded-3xl border border-slate-200 bg-white p-5 shadow-sm [&_select]:w-full [&_select]:rounded-xl [&_select]:border [&_select]:border-slate-300 [&_select]:bg-white [&_select]:px-3 [&_select]:py-2 [&_select]:text-sm [&_select]:text-slate-900 [&_select]:outline-none [&_select:focus]:border-cyan-500 [&_select:focus]:ring-2 [&_select:focus]:ring-cyan-100"'
          )
          text = text.replace(
              'className="source-actions flex gap-1"',
              'className="source-actions flex gap-1 [&_button]:rounded-lg [&_button]:border [&_button]:border-slate-300 [&_button]:bg-white [&_button]:px-2 [&_button]:py-1 [&_button]:text-xs [&_button]:font-medium [&_button]:text-slate-700 [&_button]:transition [&_button:hover]:border-cyan-400 [&_button:hover]:text-cyan-700 [&_button:disabled]:cursor-not-allowed [&_button:disabled]:opacity-40"'
          )
          text = text.replace('<label><span>', '<label className="grid gap-1 text-sm font-medium text-slate-700"><span className="text-xs text-slate-500">')
          text = text.replace('className="pill-group mt-2 flex', 'className="pill-group mt-2 flex')
          store.write_text(text)

          # Light document background.
          index = Path('index.html')
          text = index.read_text().replace('body class="min-h-screen bg-slate-50"', 'body class="min-h-screen bg-slate-50 text-slate-900"')
          index.write_text(text)

          # Remove legacy stylesheet files completely.
          for css in [Path('src/style.css'), Path('src/enhancement.css')]:
              if css.exists():
                  css.unlink()

          # Remove this one-shot workflow from the final branch.
          Path('.github/workflows/migrate-tailwind-light.yml').unlink()

          # Guard against accidental dark-theme utilities in UI components.
          forbidden = ('bg-slate-900', 'bg-slate-950', 'text-slate-100', 'text-slate-200', 'text-slate-300', 'border-slate-800', 'border-slate-700', 'shadow-black')
          for path in [Path('src/App.tsx'), Path('src/EnhancementPanel.tsx'), Path('src/StoreAssetsPanel.tsx'), Path('index.html')]:
              text = path.read_text()
              hits = [token for token in forbidden if token in text]
              if hits:
                  raise SystemExit(f'{path}: dark utilities remain: {hits}')
          PY
      - name: Commit light Tailwind migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: replace legacy CSS with Tailwind light theme"
          git push origin HEAD:style/full-tailwind-light
