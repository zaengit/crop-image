name: Generate lockfiles

on:
  push:
    branches: [hardening/runtime-correctness]

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/runtime-correctness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path crates/crop-image-wasm/Cargo.toml
      - name: Commit lockfiles
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json crates/crop-image-wasm/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh dependency lockfiles"
          git push origin HEAD:hardening/runtime-correctness
