name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crop-image-wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Install JavaScript dependencies
        run: npm install

      - name: Fetch and verify AI models
        run: npm run model:fetch

      - name: Rust tests
        run: cargo test --manifest-path crates/crop-image-wasm/Cargo.toml

      - name: Build WASM bindings
        run: npm run wasm:build

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build:web

      - name: Install Chromium for smoke test
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Production browser smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/crop-image-preview.log 2>&1 &
          npx -y @playwright/test@1.55.0 test tests/smoke.spec.js --reporter=line
