# Runtime hardening CI
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard modern source tree
        run: |
          test ! -e src/style.css
          test ! -e src/enhancement.css
          test ! -e src/react-main.tsx
          test -z "$(find src -type f \( -name '*.js' -o -name '*.jsx' \) -print -quit)"
          test -z "$(grep -RIl --exclude-dir=wasm --include='*.ts' --include='*.tsx' -e 'globalThis\.React' -e 'dangerouslySetInnerHTML' src || true)"
          test "$(find src -maxdepth 1 -type f -name '*.css' -printf '%f\n' | sort)" = "tailwind.css"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/crop-image-wasm

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Fetch and verify AI models
        run: npm run model:fetch

      - name: Rust tests
        run: cargo test --locked --manifest-path crates/crop-image-wasm/Cargo.toml

      - name: Build WASM bindings
        run: npm run wasm:build

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build:web

      - name: Verify production worker artifact
        run: |
          test -n "$(find dist/assets -maxdepth 1 -name 'worker-*.js' -print -quit)"
          test -z "$(find dist -name 'worker-*.ts' -print -quit)"
          test -f dist/mediapipe-wasm/vision_wasm_internal.wasm || test -f dist/mediapipe-wasm/vision_wasm_nosimd_internal.wasm
          test -n "$(find dist/ort-wasm -maxdepth 1 -name 'ort-wasm*.mjs' -print -quit)"
          test -n "$(find dist/ort-wasm -maxdepth 1 -name 'ort-wasm*.wasm' -print -quit)"

      - name: Install Chromium for smoke test
        run: npx playwright install --with-deps chromium

      - name: Production browser smoke test
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/crop-image-preview.log 2>&1 &
          npx playwright test tests/smoke.spec.ts --reporter=line
