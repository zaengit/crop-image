name: Bootstrap native UI dependencies

on:
  push:
    branches: [chore/native-react-tailwind]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/native-react-tailwind
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install React and Tailwind build dependencies
        run: |
          npm install react@18.3.1 react-dom@18.3.1
          npm install -D @types/react@18 @types/react-dom@18 tailwindcss@latest @tailwindcss/vite@latest
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: lock native React and Tailwind dependencies"
          git push origin HEAD:chore/native-react-tailwind
