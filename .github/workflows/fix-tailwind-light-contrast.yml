name: Fix Tailwind Light Contrast

on:
  push:
    branches: [style/full-tailwind-light]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/full-tailwind-light
      - name: Fix light theme text and controls
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          for filename in ['src/App.tsx', 'src/EnhancementPanel.tsx', 'src/StoreAssetsPanel.tsx']:
              path = Path(filename)
              text = path.read_text()
              text = re.sub(r'<(h[1-4]|strong)([^>]*className="[^"]*)text-white', r'<\1\2text-slate-950', text)
              text = text.replace('className="secondary ', 'className="secondary bg-white text-slate-700 transition hover:border-cyan-400 hover:text-cyan-700 ')
              text = text.replace('className="secondary compact ', 'className="secondary compact bg-white text-slate-700 transition hover:border-cyan-400 hover:text-cyan-700 ')
              path.write_text(text)

          # Keep solid primary/active buttons white-on-cyan.
          for filename in ['src/App.tsx', 'src/EnhancementPanel.tsx', 'src/StoreAssetsPanel.tsx']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('bg-cyan-600 px-4 py-2 font-semibold text-slate-950', 'bg-cyan-600 px-4 py-2 font-semibold text-white')
              text = text.replace('bg-cyan-600 px-5 py-2.5 font-semibold text-slate-950', 'bg-cyan-600 px-5 py-2.5 font-semibold text-white')
              text = text.replace('bg-cyan-600 font-semibold text-slate-950', 'bg-cyan-600 font-semibold text-white')
              path.write_text(text)

          Path('.github/workflows/fix-tailwind-light-contrast.yml').unlink()
          PY
      - name: Commit contrast fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: finish Tailwind light theme contrast"
          git push origin HEAD:style/full-tailwind-light
