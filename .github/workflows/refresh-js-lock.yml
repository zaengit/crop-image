name: Refresh JavaScript lockfile

on:
  push:
    branches: [hardening/runtime-correctness]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/runtime-correctness
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git rm .github/workflows/refresh-js-lock.yml
          git commit -m "Refresh JavaScript lockfile"
          git push origin HEAD:hardening/runtime-correctness
