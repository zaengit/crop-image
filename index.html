<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('crop-image-theme')
          const theme = savedTheme === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <link rel="stylesheet" href="%BASE_URL%theme.css" />
    <meta name="description" content="Generate smart-cropped image sizes and app store assets locally in your browser." />
    <title>Crop Image</title>
  </head>
  <body class="min-h-screen bg-[#f4f4f2] text-neutral-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
